<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Production Cockpit — Arkad Partners</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0b;--s1:#111113;--s2:#18181b;--s3:#222226;--s4:#2a2a2e;
  --b1:#2a2a30;--b2:#35353d;--b3:#404048;
  --t0:#fff;--t1:#e8e8ec;--t2:#9898a8;--t3:#55555f;--t4:#35353d;
  --gold:#c8a96e;--gold2:#e2c98a;--gold3:rgba(200,169,110,.12);
  --red:#d95f5f;--ra:rgba(217,95,95,.1);--rb:rgba(217,95,95,.06);
  --amb:#c4861e;--aa:rgba(196,134,30,.1);
  --grn:#4d9e72;--ga:rgba(77,158,114,.1);
  --blu:#5b8dd4;--ba:rgba(91,141,212,.1);
  --f:'Outfit',sans-serif;--m:'IBM Plex Mono',monospace;
}
html,body{height:100%;background:var(--bg);color:var(--t1);font-family:var(--f);font-weight:300;overflow:hidden}
body{display:flex;flex-direction:column}

/* ── TOPBAR ── */
#hd{height:54px;background:var(--s1);border-bottom:1px solid var(--b1);display:flex;align-items:center;padding:0 26px;gap:0;flex-shrink:0}
.hd-logo{height:20px;opacity:.9}
.hd-sep{width:1px;height:20px;background:var(--b1);margin:0 20px}
.hd-title{font-size:12px;font-weight:400;color:var(--t2);letter-spacing:.3px}
.hd-r{margin-left:auto;display:flex;align-items:center;gap:12px}
.ts{font-size:9px;color:var(--t3);font-family:var(--m)}
.live-btn{display:flex;align-items:center;gap:5px;font-size:9px;font-weight:500;color:var(--grn);font-family:var(--m);letter-spacing:.5px;border:1px solid rgba(77,158,114,.2);padding:3px 9px;border-radius:2px;cursor:pointer;transition:background .15s;user-select:none}
.live-btn:hover{background:rgba(77,158,114,.06)}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--grn);animation:pu 2.5s ease infinite;flex-shrink:0}
.live-dot.loading{animation:none;background:var(--gold);opacity:.7}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.3}}
.rbtn{width:26px;height:26px;background:none;border:1px solid var(--b1);border-radius:2px;color:var(--t3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .15s}
.rbtn:hover{color:var(--t1);border-color:var(--b2)}
.rbtn.spin{animation:sp .7s linear infinite;color:var(--gold);border-color:rgba(200,169,110,.3)}
@keyframes sp{to{transform:rotate(360deg)}}
.hd-client{font-size:9px;color:var(--t3);font-family:var(--m)}
.rflash{position:fixed;inset:0;background:rgba(200,169,110,.035);pointer-events:none;z-index:200;animation:rf .5s ease forwards}
@keyframes rf{0%{opacity:1}100%{opacity:0}}

/* ── TABS ── */
#nav{height:38px;background:var(--s1);border-bottom:1px solid var(--b1);display:flex;align-items:stretch;padding:0 22px;flex-shrink:0}
.nb{height:38px;padding:0 18px;background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;font-family:var(--f);font-size:11px;font-weight:400;color:var(--t3);letter-spacing:.35px;white-space:nowrap;display:flex;align-items:center;gap:7px;transition:color .15s,border-color .15s}
.nb:hover{color:var(--t2)}
.nb.on{color:var(--t0);border-bottom-color:var(--gold)}
.nb-k{font-family:var(--m);font-size:8px;color:var(--gold);opacity:.5;letter-spacing:.4px}
.nb-badge{font-size:8px;background:var(--red);color:#fff;border-radius:8px;padding:1px 5px;font-family:var(--m);font-weight:500;animation:bp .3s ease}
@keyframes bp{from{transform:scale(0)}to{transform:scale(1)}}

/* ── CANVAS ── */
#cv{flex:1;min-height:0;overflow-y:auto;background:var(--bg);padding:16px 22px;display:flex;flex-direction:column;gap:11px}
#cv::-webkit-scrollbar{width:3px}
#cv::-webkit-scrollbar-thumb{background:var(--b2)}

/* ── FILTERS ── */
.fb{background:var(--s1);border:1px solid var(--b1);border-radius:2px;padding:8px 14px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.fl{font-size:8px;font-weight:500;color:var(--t3);text-transform:uppercase;letter-spacing:1px;font-family:var(--m)}
.fs{font-size:11px;border:1px solid var(--b1);border-radius:2px;padding:4px 9px;background:var(--s2);color:var(--t2);cursor:pointer;outline:none;font-family:var(--f);font-weight:300;transition:all .15s}
.fs:hover,.fs:focus{border-color:var(--b2);color:var(--t1)}
.fc{margin-left:auto;font-size:9px;color:var(--t3);font-family:var(--m)}

/* ── GRIDS ── */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}

/* ── METRIC CARDS ── */
.mc{background:var(--s1);border:1px solid var(--b1);border-radius:2px;padding:16px 18px;position:relative;overflow:hidden;transition:border-color .18s,background .18s}
.mc.cp{cursor:pointer}
.mc.cp:hover{background:rgba(200,169,110,.02);border-color:var(--b2)}
.mc.on{border-color:var(--gold)!important;background:var(--gold3)}
.mc-v{font-size:28px;font-weight:200;line-height:1;font-family:var(--m);letter-spacing:-1px}
.mc-v.fl{animation:nf .4s ease}
@keyframes nf{0%{opacity:.2;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
.mc-v.r{color:var(--red)}.mc-v.a{color:var(--amb)}.mc-v.g{color:var(--grn)}.mc-v.b{color:var(--blu)}.mc-v.x{color:var(--t3)}
.mc-l{font-size:9px;font-weight:500;color:var(--t2);margin-top:7px;letter-spacing:.5px;text-transform:uppercase}
.mc-s{font-size:9px;color:var(--t3);margin-top:2px;font-family:var(--m)}
.mc-hint{font-size:9px;color:var(--t3);margin-top:8px;padding-top:8px;border-top:1px solid var(--b1);font-family:var(--m);line-height:1.5;display:none}
.mc.on .mc-hint{display:block}

/* ── ALERTS ── */
.al{border-radius:2px;padding:10px 14px;font-size:11px;font-weight:300;display:flex;align-items:flex-start;gap:10px;border-left:1px solid;line-height:1.5}
.al-bar{width:1px;min-height:14px;flex-shrink:0;margin-top:3px;border-radius:1px}
.al.am{background:var(--aa);color:rgba(196,134,30,.9);border-color:var(--amb)}
.al.re{background:var(--ra);color:rgba(217,95,95,.9);border-color:var(--red)}
.al.gr{background:var(--ga);color:rgba(77,158,114,.9);border-color:var(--grn)}
.al a{color:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:3px;opacity:.8}
.al a:hover{opacity:1}

/* ── CHART CARDS ── */
.cc{background:var(--s1);border:1px solid var(--b1);border-radius:2px;padding:16px 18px}
.ct{font-size:8px;font-weight:500;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);margin-bottom:14px;font-family:var(--m)}
.cb{position:relative}

/* ── HBARS ── */
.hr-w{display:flex;flex-direction:column;gap:8px}
.hrow{display:flex;align-items:center;gap:10px}
.hl{font-size:9px;color:var(--t2);width:82px;text-align:right;flex-shrink:0}
.ht{flex:1;background:var(--s3);border-radius:1px;height:3px;position:relative;overflow:visible}
.hf{height:100%;border-radius:1px;transition:width .7s cubic-bezier(.4,0,.2,1)}
.hp{font-size:9px;font-weight:500;width:34px;text-align:right;flex-shrink:0;font-family:var(--m)}
.tl{position:absolute;top:-5px;bottom:-5px;width:1px;background:var(--red);opacity:.22}

/* ── TABLE ── */
.tw{background:var(--s1);border:1px solid var(--b1);border-radius:2px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:11px}
thead tr{background:var(--s2)}
th{color:var(--t3);padding:9px 13px;text-align:left;font-size:8px;font-weight:500;letter-spacing:.7px;text-transform:uppercase;border-bottom:1px solid var(--b1);white-space:nowrap;font-family:var(--m)}
td{padding:9px 13px;border-bottom:1px solid var(--b1);color:var(--t2);vertical-align:middle;font-weight:300}
tbody tr{transition:background .1s;cursor:pointer}
tbody tr:hover td{background:var(--s2)}
tbody tr.on td{background:rgba(200,169,110,.04)}
tbody tr:last-child td{border-bottom:none}

/* ── BADGES ── */
.bg{display:inline-block;padding:2px 7px;border-radius:1px;font-size:8px;font-weight:500;letter-spacing:.4px;text-transform:uppercase;font-family:var(--m)}
.ov{background:var(--ra);color:var(--red)}
.cr{background:var(--aa);color:var(--amb)}
.hr{background:var(--aa);color:var(--amb)}
.wa{background:var(--ba);color:var(--blu)}
.ok{background:var(--ga);color:var(--grn)}

/* ── PROGRESS ── */
.pb{background:var(--s3);border-radius:1px;height:2px;overflow:hidden;flex:1}
.pb-f{height:100%;border-radius:1px}
.vp{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:500;font-family:var(--m);padding:2px 6px;border-radius:1px}
.vn{background:var(--ra);color:var(--red)}.vps{background:var(--ga);color:var(--grn)}

/* ── DRILL PANEL ── */
.drill{background:var(--s1);border:1px solid var(--b1);border-radius:2px;overflow:hidden;animation:si .18s ease}
@keyframes si{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.dr-hd{background:var(--s2);border-bottom:1px solid var(--b1);padding:11px 16px;display:flex;justify-content:space-between;align-items:flex-start}
.dr-ttl{font-size:12px;font-weight:400;color:var(--t0)}
.dr-sub{font-size:9px;color:var(--t3);font-family:var(--m);margin-top:3px}
.dr-close{background:none;border:1px solid var(--b1);color:var(--t3);width:22px;height:22px;border-radius:2px;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.dr-close:hover{color:var(--t1);border-color:var(--b2)}
.dr-body{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.dr-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dr-cell{background:var(--s2);border:1px solid var(--b1);border-radius:2px;padding:10px 13px}
.dr-key{font-size:8px;color:var(--t3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px;font-family:var(--m)}
.dr-val{font-size:14px;font-weight:300;color:var(--t0);font-family:var(--m)}
.dr-meta{font-size:11px;color:var(--t2);line-height:1.7;font-weight:300}
.dr-sect{font-size:8px;color:var(--t3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:7px;font-family:var(--m)}
.dr-pout{background:var(--s3);border-radius:1px;height:5px;overflow:hidden}
.dr-pin{height:100%;border-radius:1px;transition:width .7s cubic-bezier(.4,0,.2,1)}
.dr-timeline{display:flex;flex-direction:column;gap:8px}
.dr-tl-row{display:flex;align-items:center;gap:10px;font-size:10px;color:var(--t2)}
.dr-tl-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dr-tl-line{width:1px;height:14px;background:var(--b2);margin-left:3px}
.dr-actions{display:flex;flex-direction:column;gap:7px}
.dr-action{display:flex;align-items:flex-start;gap:9px;padding:9px 11px;background:var(--s2);border:1px solid var(--b1);border-radius:2px;cursor:pointer;transition:border-color .15s}
.dr-action:hover{border-color:var(--b2)}
.dr-action.done{opacity:.45}
.dr-action.done .dr-act-text{text-decoration:line-through;color:var(--t3)}
.dr-act-cb{width:14px;height:14px;border:1px solid var(--b1);border-radius:2px;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:9px;font-family:var(--m);transition:all .15s}
.dr-act-cb.done{background:var(--ga);border-color:var(--grn);color:var(--grn)}
.dr-act-label{font-size:8px;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;font-family:var(--m);margin-bottom:2px}
.dr-act-text{font-size:11px;color:var(--t2);font-weight:300;line-height:1.4}
.dr-kpirow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dr-kpi-box{background:var(--s2);border:1px solid var(--b1);border-radius:2px;padding:10px 13px}
.hist-row{display:flex;gap:3px;align-items:flex-end;height:40px}
.hist-bar{flex:1;border-radius:1px 1px 0 0;min-width:0}

/* ── DEPT CARD (clickable in capacity) ── */
.dept-card{background:var(--s1);border:1px solid var(--b1);border-radius:2px;padding:14px 16px;cursor:pointer;transition:border-color .2s,background .2s;position:relative}
.dept-card:hover{background:var(--s2);border-color:var(--b2)}
.dept-card.on{border-color:var(--gold);background:var(--gold3)}
.dept-card-name{font-size:12px;font-weight:500;color:var(--t1);margin-bottom:6px}
.dept-card-util{font-size:24px;font-weight:200;font-family:var(--m);line-height:1}
.dept-card-sub{font-size:9px;color:var(--t3);font-family:var(--m);margin-top:4px}
.dept-card-bar{height:2px;background:var(--s3);border-radius:1px;margin-top:10px;overflow:hidden}
.dept-card-fill{height:100%;border-radius:1px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.dept-detail{background:var(--s2);border:1px solid var(--b1);border-radius:2px;padding:14px 16px;animation:si .18s ease}

/* ── STAFF CARD (clickable) ── */
.staff-row{display:flex;align-items:center;gap:12px;padding:10px 13px;cursor:pointer;border-bottom:1px solid var(--b1);transition:background .1s}
.staff-row:hover{background:var(--s2)}
.staff-row:last-child{border-bottom:none}
.staff-row.on{background:rgba(200,169,110,.04)}
.staff-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;flex-shrink:0;font-family:var(--m)}

/* ── SIGNAL PAGE ── */
.sig-hd{background:var(--s1);border:1px solid var(--b1);border-left:2px solid var(--amb);border-radius:2px;padding:13px 18px}
.sig-title{font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:.8px;color:var(--amb);font-family:var(--m);margin-bottom:4px}
.sig-body{font-size:11px;color:rgba(196,134,30,.8);font-weight:300;line-height:1.5}
.sig-col{background:var(--s1);border:1px solid var(--b1);border-radius:2px;overflow:hidden}
.sig-col-hd{padding:10px 14px;border-bottom:1px solid var(--b1);display:flex;align-items:center;gap:8px}
.sig-col-t{font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:.6px;font-family:var(--m)}
.sig-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.sig-item{padding:10px 14px;border-bottom:1px solid var(--b1);font-size:10px;color:var(--t2);font-weight:300;cursor:pointer;transition:background .1s;line-height:1.5}
.sig-item:hover{background:var(--s2)}
.sig-item:last-child{border-bottom:none}
.sig-item.on{background:rgba(200,169,110,.04);border-left:1px solid var(--gold)}
.sig-item-title{font-weight:400;color:var(--t1);margin-bottom:2px}
.sig-item-detail{display:none;margin-top:8px;padding-top:8px;border-top:1px solid var(--b1);font-size:10px;color:var(--t2);line-height:1.6}
.sig-item.on .sig-item-detail{display:block}
.sig-trigger{background:var(--s2);border-radius:2px;padding:10px 14px;font-size:9px;color:var(--t3);font-family:var(--m);line-height:1.7}
.chk-action{display:flex;align-items:flex-start;gap:9px;padding:10px 12px;border-bottom:1px solid var(--b1);cursor:pointer;transition:background .1s}
.chk-action:hover{background:var(--s2)}
.chk-action:last-child{border-bottom:none}
.chk-box{width:14px;height:14px;border:1px solid var(--b1);border-radius:2px;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:9px;font-family:var(--m);transition:all .15s}
.chk-box.done{background:var(--ga);border-color:var(--grn);color:var(--grn)}
.chk-text{font-size:11px;color:var(--t2);font-weight:300;line-height:1.5;transition:all .15s}
.chk-text.done{text-decoration:line-through;color:var(--t3)}

/* ── FOOTER ── */
#ft{height:26px;background:var(--s1);border-top:1px solid var(--b1);display:flex;align-items:center;padding:0 26px;flex-shrink:0}
.ft{font-size:8px;color:var(--t3);letter-spacing:.3px;font-family:var(--m)}
.fts{color:var(--b2);margin:0 9px}
.ftr{margin-left:auto}
.lgnd{display:flex;gap:12px;margin-top:8px}
.li{display:flex;align-items:center;gap:5px;font-size:8px;color:var(--t3);font-family:var(--m)}
.ld{width:12px;height:2px;border-radius:1px}
</style>
</head>

    <button class="dr-close" onclick="sJ=null;draw()">✕</button>
  </div>
  <div class="dr-body">
    <div class="dr-meta">${j.info}</div>
    <div class="dr-grid">
      <div class="dr-cell"><div class="dr-key">Risk</div><div class="dr-val" style="color:${j.r==="Overdue"||j.r==="Critical"?"var(--red)":"var(--t0)"}">${j.r}</div></div>
      <div class="dr-cell"><div class="dr-key">Days left</div><div class="dr-val" style="color:${j.dy<0?"var(--red)":"var(--t0)"}">${j.dy<0?j.dy:"+"+j.dy}</div></div>

    <div>

          ${j.v<=-20?"Accelerating toward failure — immediate intervention required":j.v<=-10?"Significant negative velocity — action needed this week":j.v<0?"Slightly behind — monitor closely":"On target"}
        </span>
      </div>
    </div>
  </div>
</div>`;
}
function toggleJA(wo,i){
  if(!jobActions[wo])jobActions[wo]=Array(JOBS.find(j=>j.wo===wo).actions.length).fill(false);
  jobActions[wo][i]=!jobActions[wo][i];
  // Re-render just the drill without full draw
  document.getElementById("cv").innerHTML=p2();
  setTimeout(()=>a2(),30);
}
function a2(){}

/* ━━ PAGE 3 — RESOURCES ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function p3(){
  const fs=fS(),fd=fD();
  return`
<div class="fb">
  <span class="fl">Filter</span>
  <select class="fs" onchange="rDF=this.value;selStaff=null;draw()"><option value="All">Department — All</option>${DEPTS.map(d=>`<option value="${d.n}">${d.n}</option>`).join("")}</select>
  <select class="fs" onchange="rRF=this.value;selStaff=null;draw()"><option value="All">Role — All</option><option value="Welder Sr">Welder Sr</option><option value="Assembler Sr">Assembler Sr</option><option value="Engineer Sr">Engineer Sr</option><option value="Buyer Sr">Buyer Sr</option></select>
  <span class="fc">${fs.filter(s=>!s.ab).length} present · ${fs.filter(s=>s.ab).length} absent · click a person for detail</span>
</div>
<div class="g4">${[
    {v:"520",l:"Available",h:"hours this week",c:"g"},{v:"507",l:"Booked",h:"allocated to jobs",c:"a"},
    {v:"13",l:"Free",h:"remaining capacity",c:"b"},{v:"40",l:"Lost",h:"Lars Meijer · absent",c:"r"},
  ].map(m=>`<div class="mc"><div class="mc-v ${m.c}">${m.v}</div><div class="mc-l">${m.l}</div><div class="mc-s">${m.h}</div></div>`).join("")}
</div>

  <div class="cc">

    ${fs.map(s=>`
    <div class="staff-row${selStaff===s.n?" on":""}" onclick="selStaff=selStaff==='${s.n}'?null:'${s.n}';draw()">
      <div class="staff-av" style="background:${s.ab?"var(--ra)":"var(--ga)"};color:${s.ab?"var(--red)":"var(--grn)"}">
        ${s.ab?"⊘":s.av}
      </div>
      <div style="flex:1">
        <div style="font-size:11px;font-weight:400;color:${s.ab?"var(--red)":"var(--t1)"}">${s.n}</div>
        <div style="font-size:9px;color:var(--t3);font-family:var(--m)">${s.dp} · ${s.ro}</div>
      </div>
      <div style="font-size:9px;color:var(--t3);font-family:var(--m)">${s.jobs.length?s.jobs.length+" job"+(s.jobs.length!==1?"s":""):"—"}</div>
    </div>`).join("")}
  </div>
  <div>
    ${selStaff?staffDetail():`<div class="cc" style="height:100%;display:flex;align-items:center;justify-content:center"><span style="font-size:10px;color:var(--t3);font-family:var(--m)">Select a team member to view details</span></div>`}
  </div>
</div>
<div class="g2">
  <div class="al re"><div class="al-bar" style="background:var(--red)"></div>Lars Meijer absent — 40 hrs lost · Welding at 92% · Priority review: WO-2026-0007, WO-2026-0018</div>
  <div class="al gr"><div class="al-bar" style="background:var(--grn)"></div>Reallocation: Assembly +57 hrs · Engineering +56 hrs · Consider temporary reassignment to Welding</div>
</div>`;
}

    <div class="dr-cell"><div class="dr-key">Available hrs</div><div class="dr-val" style="color:${s.av===0?"var(--red)":"var(--grn)"}">${s.av} hrs</div></div>

        <span style="font-size:10px;color:var(--t1)">${j.c}</span>
        <span style="margin-left:auto;font-family:var(--m);font-size:9px;color:${j.v<0?"var(--red)":"var(--grn)"}">${j.v>0?"+":""}${j.v}%</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px">${pb(j.pc)}<span style="font-family:var(--m);font-size:8px;color:var(--t3)">${j.pc}%</span></div>
    </div>`).join("")}

/* ━━ PAGE 4 — SIGNALS ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
const SIGS=[
  {id:"s0",col:"red",title:"WO-2026-0007 — Van der Berg",short:"Overdue 21 days · 45% done · velocity −32%",
   detail:"Steel tank fabrication is accelerating toward failure. At current velocity, projected completion is 31 May — 19 days late. Customer has been informed once but expects an update within 48 hours. Action: reassign both WLD-01 welders, resolve material delivery block immediately."},
  {id:"s1",col:"red",title:"WO-2026-0018 — Dijkstra Tech",short:"Overdue 16 days · engineering sign-off pending",
   detail:"Frame structure halted pending customer engineering sign-off on modified spec. Dijkstra Tech PM confirmed no further scope changes but sign-off delayed. Risk: every day without sign-off pushes delivery further. Action: chase Dijkstra PM today for written confirmation."},
  {id:"s2",col:"red",title:"Welding dept at 92% utilisation",short:"No capacity for new jobs · Lars Meijer absent",
   detail:"Welding is the only department that cannot absorb additional work. With Lars Meijer absent, 40 hours are unrecoverable this week. Forward load projects 88% for the next 2 weeks. Any new welding job accepted now will extend existing delays. Recommend: hold new welding commitments until load drops below 80%."},
  {id:"s3",col:"amber",title:"WO-2026-0031 — Hoogenbosch",short:"Critical · 2 days to deadline · velocity −8%",
   detail:"Conveyor integration at 78% with 2 days remaining. Velocity is declining — Zone 3 cable reroute adding 6 unplanned hours. If not resolved today, delivery will slip by 1–2 days. Action: pull Kevin Smit to assist. Assembly has 57 free hours this week."},
  {id:"s4",col:"amber",title:"OTD trending below 90% target",short:"W5 at 79% · declining for 5 consecutive weeks",
   detail:"On-time delivery has been declining for 5 consecutive weeks, from 94% (W1) to 79% (W5). The trend is not improving. Root cause: accumulation of overdue Welding jobs and at-risk Assembly work. If current jobs are not resolved, OTD may fall below 75% by W8."},
];

  </div>
  <div class="sig-col">
    <div class="sig-col-hd" style="border-bottom-color:var(--amb)"><div class="sig-dot" style="background:var(--amb)"></div><span class="sig-col-t" style="color:var(--amb)">Watch — This week</span></div>
    ${SIGS.filter(s=>s.col==="amber").map(s=>`
    <div class="sig-item${selSig===s.id?" on":""}" onclick="selSig=selSig==='${s.id}'?null:'${s.id}';draw()">
      <div class="sig-item-title">${s.title}</div>
      <div style="font-size:9px;color:var(--t3);font-family:var(--m)">${s.short}</div>
      <div class="sig-item-detail">${s.detail}</div>

    <div class="sig-item${selSig==="so"?" on":""}" onclick="selSig=selSig==='so'?null:'so';draw()">
      <div class="sig-item-title">WO-2026-0044 — Bakker & Zn.</div>
      <div style="font-size:9px;color:var(--t3);font-family:var(--m)">High Risk · velocity −22% · projected 4 days late</div>
      <div class="sig-item-detail">Pipe assembly at 55% with 6 days remaining. Velocity at −22% projects completion on 12 Jun — 4 days late. Upstream engineering spec confirmed. Action: assign Pieter Bakker full-time from tomorrow. Consider 10h overtime to close gap.</div>
    </div>
  </div>
  <div class="sig-col">
    <div class="sig-col-hd" style="border-bottom-color:var(--grn)"><div class="sig-dot" style="background:var(--grn)"></div><span class="sig-col-t" style="color:var(--grn)">Opportunity — Reallocate</span></div>
    ${["Assembly: 57 free hrs · Kevin Smit available for Welding support","Engineering: 56 free hrs · Dirk van Dijk available after Zone 3 fix","QC: 39 free hrs · no immediate demand","Consider cross-training Kevin Smit on basic MIG welding"].map((t,i)=>`
    <div class="sig-item"><div class="sig-item-title">${t.split(":")[0]}</div><div style="font-size:9px;color:var(--t3)">${t.split(":").slice(1).join(":")}</div></div>`).join("")}

</div>
<div class="cc">
  <div class="ct">Management checklist — click to action</div>
  ${["Reassign welders to WO-2026-0007 — today","Chase Dijkstra Tech engineering sign-off — today","Pull Kevin Smit to support WO-2026-0031 Zone 3 rework","Confirm overtime for Welding dept this week","Call Van der Berg with revised delivery estimate"].map((t,i)=>`
  <div class="chk-action" onclick="toggleChk(${i})">
    <div class="chk-box${chks[i]?" done":""}" id="cb${i}">${chks[i]?"✓":""}</div>

  </div>`).join("")}
</div>
<div class="cc">
  <div class="ct">Signal auto-triggers when any of these thresholds are crossed</div>
  <div class="sig-trigger">overdue jobs exist &nbsp;·&nbsp; utilisation > 85% &nbsp;·&nbsp; velocity < −10% &nbsp;·&nbsp; staff absent in bottleneck dept &nbsp;·&nbsp; OTD < 90% &nbsp;·&nbsp; forward load > 85%</div>
</div>`;
}

/* ━━ CONTROLLERS ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
const R=[p0,p1,p2,p3,p4];
const A=[a0,a1,a2,a3,()=>{}];

function draw(){dC();document.getElementById("cv").innerHTML=R[pg]();setTimeout(()=>A[pg](),60)}
function go(i){
  pg=i;rF="All";dF="All";sJ=null;aC=null;cDF="All";rDF="All";rRF="All";
  selDept=null;selSig=null;
  [0,1,2,3,4].forEach(n=>document.getElementById("t"+n).classList.toggle("on",n===i));

}
function tc(f){aC=aC===f?null:f;rF=aC||"All";draw();}
function cJ(wo){
  sJ=sJ===wo?null:wo;
  document.getElementById("cv").innerHTML=p2();
  if(sJ){setTimeout(()=>{const d=document.querySelector(".drill");if(d)d.scrollIntoView({behavior:"smooth",block:"nearest"})},80);}
}
function toggleChk(i){
  chks[i]=!chks[i];
  const b=document.getElementById("cb"+i),t=document.getElementById("ct"+i);
  if(b){b.textContent=chks[i]?"✓":"";b.className="chk-box"+(chks[i]?" done":"");}
  if(t){t.className="chk-text"+(chks[i]?" done":"");}
}

startTs();draw();
</script>
</body>
